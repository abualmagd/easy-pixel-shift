name: Blog quality checks

on:
  push:
    branches:
      - improve/blog-content-quality
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint blog code
        run: >-
          npx eslint
          app/blog/page.tsx
          "app/blog/[slug]/page.tsx"
          app/src/articles.js
          app/src/blogUtils.ts
          app/src/components/blogComponent.tsx
      - name: Build application
        run: npm run build
