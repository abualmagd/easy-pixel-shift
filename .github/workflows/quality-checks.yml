name: Quality checks

on:
  push:
    branches:
      - master
      - improve/adsense-content-quality
  pull_request:
    branches:
      - master
      - improve/adsense-content-quality

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build the Next.js site
        run: npm run build
